<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06152f">
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DoseCare">
  <title>DoseCare</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/legacy-visual.css">
  <link rel="stylesheet" href="css/soft-glass.css">
  <link rel="stylesheet" href="css/author-font.css">
</head>
<body class="welcome-screen">
  <main class="welcome-portal" aria-label="DoseCare welcome screen">
    <div class="portal-glow" aria-hidden="true"></div>
    <div class="celestial-scene" aria-hidden="true">
      <div class="orbit orbit-one"></div>
      <div class="orbit orbit-two"></div>
      <div class="orbit orbit-three"></div>

      <span class="planet planet-giant"></span>
      <span class="planet planet-large"></span>
      <span class="planet planet-ringed"></span>
      <span class="planet planet-medium"></span>
      <span class="planet planet-small-a"></span>
      <span class="planet planet-small-b"></span>
      <span class="planet planet-small-c"></span>
      <span class="planet planet-small-d"></span>
      <span class="planet planet-bottom"></span>

      <div class="stars stars-a"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="stars stars-b"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="stars stars-c"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="stars stars-d"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <section class="welcome-content">
      <p class="eyebrow welcome-item">WELCOME</p>
      <h1 class="dosecare-title welcome-item">DoseCare</h1>
      <p class="description welcome-item">Pediatric Dose Calculator</p>
      <p class="developer welcome-item"><strong>Duaa Kareem</strong></p>
    </section>
  </main>

  <script>
    (function () {
      window.setTimeout(function () {
        window.location.replace('calculator.html');
      }, 4000);
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (error) {
          console.warn('DoseCare offline support could not be registered:', error);
        });
      });
    }
  </script>
</body>
</html>
