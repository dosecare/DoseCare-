<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DoseCare</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/legacy-visual.css">
  <style>
    /* iPad-safe welcome text fallback. */
    .welcome h1.dosecare-title {
      position: relative;
      z-index: 10;
      display: block;
      width: max-content;
      max-width: 92vw;
      color: #dfe9f7;
      -webkit-text-fill-color: #dfe9f7;
      text-shadow: 0 0 10px rgba(120,220,255,.28), 0 0 24px rgba(156,145,255,.18);
    }
    .welcome-page .welcome-item { will-change: transform, opacity; }
    .welcome-page .space-scene .planet { will-change: transform; }
    .welcome-page .space-scene .star { will-change: opacity, transform; }
    .welcome-page .space-scene .nebula,
    .welcome-page .space-scene:before { will-change: transform, opacity; }
    @media (max-width:600px) {
      .welcome h1.dosecare-title { font-size:clamp(3rem,16vw,4.6rem); line-height:1.05; min-height:1.05em; white-space:nowrap; }
    }
  </style>
</head>
<body class="welcome-page">
  <div class="bubbles" aria-hidden="true">
    <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
  </div>
  <div class="space-scene" aria-hidden="true">
    <div class="nebula nebula-one"></div>
    <div class="nebula nebula-two"></div>
    <div class="orbit orbit-one"></div>
    <div class="orbit orbit-two"></div>
    <div class="orbit orbit-three"></div>
    <div class="planet planet-giant"></div>
    <div class="planet planet-glass planet-left"></div>
    <div class="planet planet-glass planet-right"></div>
    <div class="planet planet-small planet-bottom"></div>
    <div class="planet planet-ringed"></div>
    <div class="star-field">
      <i class="star tiny s1"></i><i class="star tiny s2"></i><i class="star sparkle s3"></i><i class="star tiny s4"></i>
      <i class="star small s5"></i><i class="star tiny s6"></i><i class="star sparkle s7"></i><i class="star tiny s8"></i>
      <i class="star small s9"></i><i class="star tiny s10"></i><i class="star sparkle s11"></i><i class="star tiny s12"></i>
      <i class="star small s13"></i><i class="star tiny s14"></i><i class="star sparkle s15"></i><i class="star tiny s16"></i>
      <i class="star tiny s17"></i><i class="star small s18"></i><i class="star sparkle s19"></i><i class="star tiny s20"></i>
      <i class="star tiny s21"></i><i class="star small s22"></i><i class="star sparkle s23"></i><i class="star tiny s24"></i>
      <i class="star tiny s25"></i><i class="star small s26"></i><i class="star sparkle s27"></i><i class="star tiny s28"></i>
      <i class="star tiny s29"></i><i class="star small s30"></i><i class="star sparkle s31"></i><i class="star tiny s32"></i>
      <i class="star tiny s33"></i><i class="star sparkle s34"></i><i class="star small s35"></i><i class="star tiny s36"></i>
    </div>
  </div>
  <main class="welcome" style="font-family: Georgia, 'Times New Roman', serif;">
    <p class="eyebrow welcome-item welcome-item-1">WELCOME</p>
    <h1 class="dosecare-title welcome-item welcome-item-2">DoseCare</h1>
    <p class="description welcome-item welcome-item-3">Pediatric Dose Calculator</p>
    <p class="developer welcome-item welcome-item-4">Developed by <strong>Duaa Kareem</strong></p>
  </main>
  <script>
    (function () {
      var scene = document.querySelector('.space-scene');
      var welcome = document.querySelector('.welcome');
      if (!scene || !welcome) return;
      var planets = Array.prototype.slice.call(scene.querySelectorAll('.planet'));
      var stars = Array.prototype.slice.call(scene.querySelectorAll('.star'));
      var nebulae = Array.prototype.slice.call(scene.querySelectorAll('.nebula'));
      var items = Array.prototype.slice.call(welcome.querySelectorAll('.welcome-item'));
      var logo = document.querySelector('.dosecare-title');
      var start = performance.now();
      items.forEach(function (item) { item.style.animation = 'none'; item.style.opacity = '0'; });
      var delays = [100, 250, 420, 580];
      var colors = [[238,241,245],[120,220,255],[169,156,255],[220,228,239]];
      function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
      function colorAt(seconds) {
        var cycle = (seconds % 7) / 7;
        var scaled = cycle * (colors.length - 1);
        var i = Math.floor(scaled), f = scaled - i;
        var a = colors[i], b = colors[Math.min(i + 1, colors.length - 1)];
        return [Math.round(a[0] + (b[0] - a[0]) * f), Math.round(a[1] + (b[1] - a[1]) * f), Math.round(a[2] + (b[2] - a[2]) * f)];
      }
      function animate(now) {
        var t = now - start, seconds = t / 1000;
        items.forEach(function (item, i) {
          var local = Math.max(0, Math.min(1, (t - delays[i]) / 1150));
          var p = easeOut(local), float = local >= 1 ? Math.sin((seconds * 0.9) + i) * 1.4 : 0;
          item.style.opacity = p.toFixed(3);
          item.style.transform = 'translate3d(0,' + ((1 - p) * 16 + float).toFixed(2) + 'px,0)';
        });
        if (logo) {
          var c = colorAt(seconds), rgb = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
          logo.style.color = rgb;
          logo.style.webkitTextFillColor = rgb;
          logo.style.textShadow = '0 0 11px rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',.22), 0 0 28px rgba(120,190,255,.12)';
        }
        planets.forEach(function (planet, i) {
          var ampX = [10,7,9,6,8][i] || 7, ampY = [8,6,10,7,9][i] || 7, period = [18,13,15,11,12][i] || 14, phase = i * 1.7;
          var x = Math.sin((seconds / period) * Math.PI * 2 + phase) * ampX;
          var y = Math.cos((seconds / (period * 1.17)) * Math.PI * 2 + phase) * ampY;
          var r = Math.sin((seconds / period) * Math.PI * 2 + phase) * (i === 0 ? 2 : 1.5);
          planet.style.transform = 'translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0) rotate(' + r.toFixed(2) + 'deg)';
        });
        stars.forEach(function (star, i) {
          var period = 2.8 + (i % 7) * .45, phase = i * .83;
          var wave = (Math.sin((seconds / period) * Math.PI * 2 + phase) + 1) / 2;
          star.style.opacity = (.38 + wave * .58).toFixed(3);
          star.style.transform = 'scale(' + (.78 + wave * .28).toFixed(3) + ')';
        });
        nebulae.forEach(function (nebula, i) {
          var x = Math.sin(seconds / (8 + i * 2)) * 6, y = Math.cos(seconds / (10 + i * 2)) * 4;
          nebula.style.transform = 'translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0) rotate(' + (i ? 24 : -18) + 'deg)';
        });
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    })();
    window.setTimeout(function () { window.location.href = "calculator.html"; }, 4000);
  </script>
  <script src="js/pwa.js"></script>
</body>
</html>
