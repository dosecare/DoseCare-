<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="78%">
    <stop offset="0" stop-color="#173d72"/>
    <stop offset="0.55" stop-color="#0a2147"/>
    <stop offset="1" stop-color="#030b20"/>
  </radialGradient>
  <linearGradient id="cross" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#ffffff"/>
    <stop offset="0.52" stop-color="#eafaff"/>
    <stop offset="1" stop-color="#8bdcff"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#eafaff"/>
    <stop offset="0.5" stop-color="#77d8ff"/>
    <stop offset="1" stop-color="#5c91df"/>
  </linearGradient>
  <radialGradient id="planet" cx="35%" cy="30%" r="75%">
    <stop stop-color="#f5fcff"/>
    <stop offset="0.5" stop-color="#b9e6ff"/>
    <stop offset="1" stop-color="#6c96d1"/>
  </radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Deep-space rounded app tile -->
<rect width="512" height="512" rx="112" fill="url(#bg)"/>
<rect x="17" y="17" width="478" height="478" rx="98" fill="none" stroke="#8dbce8" stroke-width="5" opacity=".28"/>
<rect x="29" y="29" width="454" height="454" rx="88" fill="none" stroke="#bce8ff" stroke-width="2" opacity=".10"/>

<!-- Subtle space glow -->
<ellipse cx="256" cy="254" rx="188" ry="154" fill="#2570c5" opacity=".10" filter="url(#glow)"/>
<ellipse cx="155" cy="122" rx="92" ry="68" fill="#54bfff" opacity=".045"/>

<!-- Stars: varied sizes and sparkle shapes -->
<g fill="#ffffff">
  <circle cx="82" cy="91" r="2.5" opacity=".9"/>
  <circle cx="424" cy="92" r="2.2" opacity=".85"/>
  <circle cx="453" cy="196" r="1.8" opacity=".75"/>
  <circle cx="78" cy="335" r="1.8" opacity=".7"/>
  <circle cx="391" cy="116" r="1.6" opacity=".75"/>
  <circle cx="128" cy="406" r="1.5" opacity=".7"/>
  <circle cx="351" cy="394" r="1.7" opacity=".8"/>
</g>
<g stroke="#ffffff" stroke-linecap="round" filter="url(#softGlow)">
  <path d="M344 52v31M328.5 67.5h31" stroke-width="2.2" opacity=".95"/>
  <path d="M105 170v24M93 182h24" stroke-width="1.7" opacity=".85"/>
  <path d="M421 292v22M410 303h22" stroke-width="1.5" opacity=".8"/>
  <path d="M160 352v17M151.5 360.5h17" stroke-width="1.4" opacity=".72"/>
</g>

<!-- Main medical cross, clean and unmistakable at small sizes -->
<g filter="url(#glow)">
  <path d="M220 112h72v108h108v72H292v108h-72V292H112v-72h108z"
        fill="url(#cross)" stroke="#d9f5ff" stroke-width="4" stroke-linejoin="round"/>
</g>
<path d="M220 124h72v104h104v48H292v104h-48V276H140v-48h104V124z"
      fill="#f7fdff" opacity=".32"/>

<!-- Elegant orbital loop around the medical symbol -->
<ellipse cx="256" cy="256" rx="207" ry="132"
         fill="none" stroke="url(#ring)" stroke-width="12" opacity=".90"
         transform="rotate(-28 256 256)"/>
<path d="M76 338C139 414 299 430 410 350"
      fill="none" stroke="#9ee6ff" stroke-width="7" opacity=".42"
      stroke-linecap="round"/>

<!-- Ringed planet accent, bottom-right -->
<g transform="translate(406 405)" filter="url(#softGlow)">
  <ellipse rx="58" ry="17" fill="none" stroke="#709fe0" stroke-width="10" opacity=".72" transform="rotate(-18)"/>
  <circle r="31" fill="url(#planet)" stroke="#86b8eb" stroke-width="2"/>
  <path d="M-21 -7q21-13 42 0" fill="none" stroke="#ffffff" stroke-width="3" opacity=".38"/>
  <ellipse rx="58" ry="17" fill="none" stroke="#bdeaff" stroke-width="3" opacity=".9" transform="rotate(-18)"/>
</g>

<!-- Tiny orbiting dot -->
<circle cx="105" cy="391" r="9" fill="#8edfff" opacity=".75" filter="url(#softGlow)"/>

<!-- No text: keeps the launcher icon clean and legible -->
</svg>
