<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DoseCare — Calculator</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/legacy-visual.css">
</head>
<body>
<div class="bubbles" aria-hidden="true"><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span></div>
<div class="star-groups" aria-hidden="true"><span class="star-group star-group-a"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="star-group star-group-b"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="star-group star-group-c"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
<main class="page calculator-page">
  <header class="topbar"><a href="index.html" class="brand">DoseCare</a></header>
  <section class="glass-card calculator-card">
    <div class="section-heading"><p class="eyebrow">DOSE CALCULATOR</p><p>Select the medicine to begin.</p></div>
    <form id="dose-form" novalidate>
      <label class="field medicine-search-field"><span>Search medicine</span><input id="medicine-search" type="search" autocomplete="off" placeholder="Type the first letters of a medicine…"></label>
      <label class="field"><span>Treatment</span><select id="medicine-select" required><option value="">Select treatment</option></select></label>
      <div id="condition-field" class="field" hidden><label for="condition-select">Condition</label><select id="condition-select"></select></div>
      <div class="dose-preview glass-field"><span>Recommended pediatric dose</span><strong id="recommended-dose">Select a treatment first</strong></div>
      <div class="grid-2">
        <label class="field"><span>Age</span><div class="inline-input"><input id="age-value" type="number" min="0" step="0.1" inputmode="decimal" placeholder="Age"><select id="age-unit"><option value="weeks">Weeks</option><option value="months">Months</option><option value="years">Years</option></select></div></label>
        <label class="field"><span>Weight</span><div class="unit-input"><input id="weight-value" type="number" min="0" step="0.1" inputmode="decimal" placeholder="Weight"><span>kg</span></div></label>
      </div>
      <div id="concentration-field" class="field" hidden><label for="concentration-select">Oral-liquid concentration</label><select id="concentration-select"></select></div>
      <p id="form-message" class="form-message" role="alert"></p>
      <button class="primary-button" type="submit">CALCULATE DOSE</button>
    </form>
  </section>
</main>
<script src="js/database.js"></script>
<script src="js/database-loader.js"></script>
<script>(function(){const search=document.getElementById('medicine-search'),select=document.getElementById('medicine-select');if(!search||!select)return;function filterMedicines(){const query=search.value.trim().toLowerCase(),current=select.value;Array.from(select.options).forEach((option,index)=>{if(index===0)return;option.hidden=!!query&&!option.textContent.trim().toLowerCase().startsWith(query)});if(current&&select.options[select.selectedIndex]&&select.options[select.selectedIndex].hidden)select.value=''}search.addEventListener('input',filterMedicines)})();</script>
<script src="js/dynamic-fields.js"></script>
</body></html>
