name: Build DoseCare V2 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'dosecare-v2/android/**'
      - 'dosecare-v2/**'
      - '.github/workflows/android-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dosecare-v2/android
    steps:
      - name: Checkout V2
        uses: actions/checkout@v4

      - name: Prepare bundled DoseCare V2 assets
        working-directory: .
        run: |
          mkdir -p dosecare-v2/android/app/src/main/assets/dosecare-v2
          rsync -a --exclude='android/app/src/main/assets/dosecare-v2' dosecare-v2/ dosecare-v2/android/app/src/main/assets/dosecare-v2/

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build release APK and AAB
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dosecare-v2-debug-apk
          path: dosecare-v2/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dosecare-v2-release-apk-unsigned
          path: dosecare-v2/android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: dosecare-v2-release-aab-unsigned
          path: dosecare-v2/android/app/build/outputs/bundle/release/app-release.aab
