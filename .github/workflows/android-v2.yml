name: Build DoseCare V2 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'dosecare-v2/android/**'
      - 'dosecare-v2/**'
      - '.github/workflows/android-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dosecare-v2/android
    steps:
      - name: Checkout V2
        uses: actions/checkout@v4

      - name: Prepare bundled DoseCare V2 assets
        working-directory: .
        run: |
          mkdir -p dosecare-v2/android/app/src/main/assets
          rm -rf dosecare-v2/android/app/src/main/assets/dosecare-v2
          cp -R dosecare-v2 dosecare-v2/android/app/src/main/assets/dosecare-v2
          rm -rf dosecare-v2/android/app/src/main/assets/dosecare-v2/android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dosecare-v2-debug-apk
          path: dosecare-v2/android/app/build/outputs/apk/debug/app-debug.apk
