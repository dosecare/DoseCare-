name: DoseCare iOS Build

on:
  workflow_dispatch:
  push:
    branches: [dosecare-v2-rebuild]
    paths:
      - 'dosecare-v2/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/mobile-ios-build.yml'

jobs:
  ios-build:
    name: Build iOS app bundle
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web assets into iOS project
        run: npx cap sync ios

      - name: Verify generated iOS project
        working-directory: ios
        run: |
          set -euxo pipefail
          pwd
          find . -maxdepth 3 -type f \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -print

      - name: Build unsigned iOS simulator app
        working-directory: ios
        run: |
          set -euxo pipefail
          WORKSPACE="$(find . -maxdepth 3 -name '*.xcworkspace' -print -quit)"
          PROJECT="$(find . -maxdepth 3 -name '*.xcodeproj' -print -quit)"

          if [ -n "$WORKSPACE" ]; then
            SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
            echo "Building Xcode workspace: $WORKSPACE"
            xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          elif [ -n "$PROJECT" ]; then
            SCHEME="$(basename "$PROJECT" .xcodeproj)"
            echo "Building Xcode project: $PROJECT"
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          else
            echo "No Xcode workspace or project was generated."
            exit 1
          fi

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: dosecare-ios-simulator-app
          path: ios/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
